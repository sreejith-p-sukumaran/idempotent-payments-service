spring:
  application:
    name: idempotent-payments-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DATABASE_USER:payments}
    password: ${DATABASE_PASSWORD:payments}

  jpa:
    # Flyway owns the schema; Hibernate only validates that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

idempotency:
  # How long records are kept so a late retry can replay before the key is
  # treated as fresh again, and how often the expiry sweep runs.
  retention: ${IDEMPOTENCY_RETENTION:24h}
  cleanup:
    interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:1h}

logging:
  level:
    org.flywaydb: info
